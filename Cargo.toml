[workspace]
resolver = "3"
members = [
    "crates/wb-core",
    "crates/wb-store",
    "crates/wb-check",
    "crates/wb-propose",
    "crates/wb-mcp",
    "crates/wb-terrain",
    "src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
# 1.88 is rmcp's floor, and wb-mcp is a workspace member.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
